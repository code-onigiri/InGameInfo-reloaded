// Optional third-party mods for local debugging, fetched from CurseForge Maven.
//
// The catalog below pins one file per mod for each supported Minecraft version.
// `downloadDebugMods` resolves every entry into libs/debug-mods so the jars are
// available offline and visible for inspection. `runClient` and `runServer`
// resolve only the entries enabled in ext.debugMods (plus their catalog
// dependencies) and copy those into run/mods.
//
// Flip entries in the version's build.gradle, for example:
//   ext.debugMods = [tconstruct: true, cobblemon: false, ...]
//
// CurseForge Maven coordinates are `curse.maven:<descriptor>-<project>:<file>`.
// File ids are pinned so a build reproduces the tested mod set. Update a file id
// here when a newer build should be tested.
//
// Only files listed in run/mods/.igi-debug-mods are managed; other jars in
// run/mods are left alone.

import java.util.Locale

def debugModsDir = file('libs/debug-mods')
def runModsDir = file('run/mods')
def markerFile = new File(runModsDir, '.igi-debug-mods')
def forgeDeobf = project.hasProperty('igiForgeDeobf') &&
        project.property('igiForgeDeobf').toString() == 'true'
def mcVersion = project.property('minecraft_version').toString()

// deps are other aliases in the same version catalog. They are downloaded and
// loaded when the parent is enabled, matching the mandatory dependencies and
// language providers declared by the mod jars.
def catalogByVersion = [
        '1.20.1': [
                tconstruct   : [coord: 'curse.maven:tconstruct-74072:8944121', deps: ['mantle']],
                mantle       : [coord: 'curse.maven:mantle-74924:8809819', deps: []],
                cobblemon    : [coord: 'curse.maven:cobblemon-687131:5375390', deps: ['kotlinforforge']],
                kotlinforforge: [coord: 'curse.maven:kotlin-for-forge-351264:7291067', deps: []],
                mekanism     : [coord: 'curse.maven:mekanism-268560:6552911', deps: []],
                ae2          : [coord: 'curse.maven:ae2-223794:8991271', deps: ['guideme']],
                guideme      : [coord: 'curse.maven:guideme-1173950:8204776', deps: []],
                botania      : [coord: 'curse.maven:botania-225643:8901969', deps: ['patchouli', 'curios']],
                patchouli    : [coord: 'curse.maven:patchouli-306770:7731017', deps: []],
                curios       : [coord: 'curse.maven:curios-309927:6418456', deps: []],
        ],
        '1.21.1': [
                cobblemon    : [coord: 'curse.maven:cobblemon-687131:9124643', deps: ['kotlinforforge']],
                kotlinforforge: [coord: 'curse.maven:kotlin-for-forge-351264:8335665', deps: []],
                mekanism     : [coord: 'curse.maven:mekanism-268560:7904058', deps: []],
                ae2          : [coord: 'curse.maven:ae2-223794:8992605', deps: ['guideme']],
                guideme      : [coord: 'curse.maven:guideme-1173950:9292538', deps: []],
        ],
        '26.1.2': [
                ae2          : [coord: 'curse.maven:ae2-223794:9022271', deps: ['guideme']],
                guideme      : [coord: 'curse.maven:guideme-1173950:9022838', deps: []],
        ],
]
def catalog = catalogByVersion[mcVersion] ?: [:]

repositories {
    flatDir {
        dirs debugModsDir
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

def debugConfiguration = configurations.findByName('igiDebugMods')
if (debugConfiguration == null) {
    debugConfiguration = configurations.create('igiDebugMods') {
        canBeConsumed = false
        canBeResolved = true
    }
}
def downloadConfiguration = configurations.findByName('igiDebugDownloads')
if (downloadConfiguration == null) {
    downloadConfiguration = configurations.create('igiDebugDownloads') {
        canBeConsumed = false
        canBeResolved = true
    }
}

def flagValues = project.findProperty('debugMods')
if (flagValues == null) {
    flagValues = [:]
}
if (!(flagValues instanceof Map)) {
    throw new GradleException("ext.debugMods must be a Map of true/false values in build.gradle")
}

def requested = flagValues.findAll { key, value ->
    value == true || (value != null && value.toString().equalsIgnoreCase('true'))
}.keySet().collect { it.toString().trim().toLowerCase(Locale.ROOT) }
        .findAll { !it.isEmpty() }
        .sort()

def selected = new LinkedHashSet<String>()
requested.each { name ->
    if (!catalog.containsKey(name)) {
        throw new GradleException("Unknown debug mod '${name}' enabled in ext.debugMods for ${mcVersion}. " +
                "Available: ${catalog.keySet().sort().join(', ')}")
    }
    selected.add(name)
}

def expanded = new LinkedHashSet<String>()
def visit
visit = { String name ->
    if (!expanded.add(name)) {
        return
    }
    def info = catalog[name]
    if (info == null) {
        return
    }
    info.deps.each { dep ->
        if (!catalog.containsKey(dep)) {
            throw new GradleException("Debug mod '${name}' needs '${dep}', but it is not in the ${mcVersion} catalog")
        }
        visit(dep)
    }
}
selected.each { visit(it) }

debugConfiguration.dependencies.clear()
expanded.each { name ->
    def coordinate = catalog[name].coord
    if (forgeDeobf) {
        // fg.deobf needs a resolvable local artifact. The download task fills
        // libs/debug-mods before this configuration is resolved.
        def parts = coordinate.split(':')
        def artifact = parts[1] + '-' + parts[2]
        def cut = artifact.lastIndexOf('-')
        def local = "igiDebug:${artifact.substring(0, cut)}:${artifact.substring(cut + 1)}"
        debugConfiguration.dependencies.add(dependencies.create(project.fg.deobf(local)))
    }
    else {
        debugConfiguration.dependencies.add(dependencies.create(coordinate))
    }
}

downloadConfiguration.dependencies.clear()
catalog.each { name, info ->
    downloadConfiguration.dependencies.add(dependencies.create(info.coord))
}

tasks.register('downloadDebugMods') {
    group = 'ingameinfo'
    description = 'Downloads every catalogued debug mod for this Minecraft version into libs/debug-mods.'
    doLast {
        debugModsDir.mkdirs()
        def files = downloadConfiguration.files
        if (files.isEmpty()) {
            println "[igi] No debug mods catalogued for ${mcVersion}."
            return
        }
        copy {
            from files
            into debugModsDir
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
        println "[igi] Downloaded ${files.size()} debug mod jar(s) for ${mcVersion} into ${debugModsDir}."
    }
}

tasks.register('listDebugMods') {
    group = 'ingameinfo'
    description = 'Lists the CurseForge Maven debug mod catalog and whether ext.debugMods enables it.'
    doLast {
        if (catalog.isEmpty()) {
            println "No debug mods catalogued for ${mcVersion}."
            return
        }
        println "Debug mods for ${mcVersion} (CurseForge Maven):"
        catalog.each { name, info ->
            def state = expanded.contains(name) ? (selected.contains(name) ? 'ON  ' : 'AUTO') : 'off '
            def deps = info.deps.isEmpty() ? '' : " deps=${info.deps.join(',')}"
            println "  [${state}] ${name.padRight(15)} ${info.coord}${deps}"
        }
        println "Enabled: ${selected.isEmpty() ? 'none' : selected.join(', ')}"
    }
}

tasks.register('syncDebugMods') {
    group = 'ingameinfo'
    description = 'Copies the enabled CurseForge Maven debug mods into run/mods and removes the previous selection.'
    outputs.upToDateWhen { false }
    dependsOn tasks.named('downloadDebugMods')

    doLast {
        runModsDir.mkdirs()
        if (markerFile.isFile()) {
            markerFile.readLines().findAll { !it.trim().isEmpty() }.each { name ->
                def old = new File(runModsDir, name)
                if (old.isFile()) {
                    old.delete()
                }
            }
            markerFile.delete()
        }

        def sourceFiles = debugConfiguration.files
        if (!sourceFiles.isEmpty()) {
            copy {
                from sourceFiles
                into runModsDir
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            }
        }

        def copiedNames = sourceFiles.collect { it.name }
        if (!copiedNames.isEmpty()) {
            markerFile.text = copiedNames.join('\n') + '\n'
        }
        logger.lifecycle("[igi] Debug mods: ${selected.isEmpty() ? 'none' : selected.join(', ')}")
    }
}

['runClient', 'runServer'].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn tasks.named('syncDebugMods')
    }
}
