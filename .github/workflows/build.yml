name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.20.1"
            java: "17"
            gradle: "8.8"
          - version: "1.21.1"
            java: "21"
            gradle: "8.8"
          - version: "26.1.2"
            java: "25"
            gradle: "9.8.2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # The version projects do not commit gradle-wrapper.jar, so install
      # the Gradle version each project's wrapper properties specify.
      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build
        working-directory: versions/${{ matrix.version }}
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ingameinfo-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: warn
